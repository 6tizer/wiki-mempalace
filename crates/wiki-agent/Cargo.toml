[package]
name = "wiki-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.30", default-features = false, features = ["std"] }
ratatui-crossterm = { version = "0.1", default-features = false, features = ["crossterm_0_28"] }
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
wiki-ai = { path = "../wiki-ai" }
wiki-core = { path = "../wiki-core" }
wiki-kernel = { path = "../wiki-kernel" }
wiki-storage = { path = "../wiki-storage" }
wiki-tools = { path = "../wiki-tools" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
