[package]
name = "wiki-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = "0.31"
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
wiki-ai = { path = "../wiki-ai" }
wiki-core = { path = "../wiki-core" }
wiki-kernel = { path = "../wiki-kernel" }
wiki-storage = { path = "../wiki-storage" }
wiki-tools = { path = "../wiki-tools" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
