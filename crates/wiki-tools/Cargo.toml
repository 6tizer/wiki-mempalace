[package]
name = "wiki-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
wiki-ai = { path = "../wiki-ai" }
wiki-core = { path = "../wiki-core" }
wiki-kernel = { path = "../wiki-kernel" }
wiki-mempalace-bridge = { path = "../wiki-mempalace-bridge", features = ["live"] }
wiki-storage = { path = "../wiki-storage" }

[dev-dependencies]
tempfile = "3"
