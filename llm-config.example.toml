[llm]
# OpenAI-compatible base url. DeepSeek examples:
# - https://api.deepseek.com
# - https://api.deepseek.com/v1
base_url = "https://api.deepseek.com/v1"

# Fill your key locally. Do NOT commit real keys.
# Prefer api_key_env. Inline api_key remains supported only as local fallback.
api_key_env = "DEEPSEEK_API_KEY"
api_key = "YOUR_API_KEY_HERE"

# Example models (adjust to your account):
model = "deepseek-chat"

# Optional governance knobs.
timeout_seconds = 60
max_retries = 2
max_input_chars = 200000
max_response_chars = 200000
max_output_tokens = 16384
allowed_base_urls = ["https://api.deepseek.com", "https://api.openai.com", "https://openrouter.ai"]

[llm_profiles.fixer_judge]
# Used by evidence-heavy Fixer judgment paths.
inherits = "default"
model = "deepseek-reasoner"
reasoning_effort = "high"
temperature = 0.0
max_output_tokens = 8192

[llm_profiles.fixer_patch]
# Used by bounded JSON patch generation.
inherits = "default"
model = "deepseek-chat"
reasoning_effort = "medium"
temperature = 0.0

[llm_profiles.synthesis_research]
# Used to generate research/search questions for synthesis.
inherits = "default"
model = "deepseek-reasoner"
reasoning_effort = "high"

[llm_profiles.synthesis_writer]
# Used to draft long-form synthesis pages.
inherits = "default"
model = "deepseek-reasoner"
reasoning_effort = "high"
max_output_tokens = 24000

[llm_profiles.synthesis_verifier]
# Used to reject unsupported or low-quality synthesis drafts.
inherits = "default"
model = "deepseek-chat"
reasoning_effort = "medium"
temperature = 0.0

[llm_profiles.agent_manager]
# Used by wiki-agent to plan tool calls and sub-agent delegation.
inherits = "default"
model = "deepseek-reasoner"
reasoning_effort = "high"
temperature = 0.0
max_output_tokens = 12000

[llm_profiles.agent_worker_lint]
# Used by wiki-agent lint worker for concise issue triage.
inherits = "default"
model = "deepseek-chat"
reasoning_effort = "medium"
temperature = 0.0

[llm_profiles.agent_worker_governance]
# Used by wiki-agent governance worker to summarize scan evidence.
inherits = "default"
model = "deepseek-chat"
reasoning_effort = "medium"
temperature = 0.0

[llm_profiles.agent_worker_fixer]
# Used by wiki-agent fixer worker for evidence-sensitive repair decisions.
inherits = "fixer_judge"

[llm_profiles.agent_worker_synthesis]
# Used by wiki-agent synthesis worker to coordinate discovery and composition.
inherits = "synthesis_research"

[llm_profiles.agent_worker_search]
# Used by wiki-agent search worker to plan local/web evidence gathering.
inherits = "default"
model = "deepseek-reasoner"
reasoning_effort = "high"
temperature = 0.0

[llm_profiles.agent_memory_curator]
# Used after chat sessions to extract verified durable memories and skills.
inherits = "default"
model = "deepseek-chat"
reasoning_effort = "medium"
temperature = 0.0

[web_search.providers.exa]
kind = "exa"
api_key_env = "EXA_API_KEY"
max_results = 8
timeout_secs = 20

[web_search.providers.xai]
kind = "xai"
api_key_env = "XAI_API_KEY"
model = "grok-4.3"
tools = ["web_search", "x_search"]
max_results = 8
timeout_secs = 20

[web_search.policies.cross_verify]
# Fixer/Synthesis use this policy when an action requires external evidence.
providers = ["exa", "xai"]
min_providers = 2
min_distinct_domains = 2

# Optional: OpenAI-compatible embeddings (used with `wiki-cli query --vectors`).
# If omitted, `--vectors` will error until you add this section.
# [embed]
# model = "text-embedding-3-small"
# base_url = "https://api.openai.com/v1"   # optional; defaults to [llm].base_url
# api_key_env = "OPENAI_API_KEY"           # optional; preferred over inline api_key
# api_key = "YOUR_EMBED_KEY"               # optional; defaults to [llm].api_key
